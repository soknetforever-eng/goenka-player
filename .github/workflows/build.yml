name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GoenkaPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoenkaPlayer-apk
          path: GoenkaPlayer.apk

      - name: Publish to Releases (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" GoenkaPlayer.apk --title "Goenka Player $TAG" --notes "Install GoenkaPlayer.apk on Android."
