name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key (from repository secrets)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/goenka.jks"
            echo "KS_PATH=$RUNNER_TEMP/goenka.jks" >> "$GITHUB_ENV"
            echo "Using fixed signing key"
          else
            echo "No KEYSTORE_B64 secret: using debug key"
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GoenkaPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoenkaPlayer-apk
          path: GoenkaPlayer.apk

      - name: Publish to Releases (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" GoenkaPlayer.apk --title "Goenka Player $TAG" --notes "Install GoenkaPlayer.apk on Android."
