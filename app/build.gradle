plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ratanak.goenkaplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ratanak.goenkaplayer'
        minSdk 26
        targetSdk 34
        versionCode((project.findProperty('vc') ?: '3').toString().toInteger())
        versionName '1.' + (project.findProperty('vc') ?: '3')
    }

    // Fixed signing key from GitHub Secrets, so new versions install over old ones.
    // (Falls back to the debug key when the secret is not set.)
    def ksPath = System.getenv('KS_PATH')
    signingConfigs {
        fixed {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('KS_PASS')
                keyAlias 'goenka'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
