plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ratanak.goenkaplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ratanak.goenkaplayer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
